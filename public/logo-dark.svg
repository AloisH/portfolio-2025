<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#000000" rx="6"/>

  <!-- H letter with rainbow gradient -->
  <!-- Left vertical bar -->
  <rect x="7" y="6" width="4" height="20" fill="url(#rainbowGradient)"/>

  <!-- Horizontal bar -->
  <rect x="7" y="14" width="18" height="4" fill="url(#rainbowGradient)"/>

  <!-- Right vertical bar -->
  <rect x="21" y="6" width="4" height="20" fill="url(#rainbowGradient)"/>
</svg>
