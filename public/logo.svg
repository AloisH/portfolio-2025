<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Blocky H letter -->
  <!-- Left vertical bar -->
  <rect x="20" y="15" width="12" height="70" fill="url(#rainbowGradient)"/>

  <!-- Horizontal bar -->
  <rect x="20" y="44" width="60" height="12" fill="url(#rainbowGradient)"/>

  <!-- Right vertical bar -->
  <rect x="68" y="15" width="12" height="70" fill="url(#rainbowGradient)"/>
</svg>
